name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v6

      - name: Lint and unit test
        run: ./gradlew lintDebug testDebugUnitTest --no-daemon

  release-scripts:
    name: release-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Shellcheck release wizard
        run: shellcheck -x scripts/release-wizard.sh scripts/lib/release-runbook.sh scripts/tests/test_release_runbook.sh

      - name: Release runbook tests
        run: scripts/tests/test_release_runbook.sh
